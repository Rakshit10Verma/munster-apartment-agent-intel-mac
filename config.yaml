housing_rules:
  max_warm_rent_single_eur: 600
  min_duration_months: 6
  min_zwischenmiete_months: 1
  # Zwischenmiete (explicit temporary sublet) is judged by a MAXIMUM duration, not a
  # minimum: a genuinely short-term sublet is exactly what we want. Longer temporary
  # sublets are only accepted when the rent is cheap enough to be worth the shorter
  # commitment anyway.
  zwischenmiete_max_duration_months: 6
  zwischenmiete_price_exception_below_eur: 400
  hard_skip:
    women_only: true
    wbs_required: true
    # Informational only (not read by app/rules.py): age mismatch is never a hard
    # skip, regardless of how strictly a listing states its preferred age range. It
    # is always handled as a soft warning, and the drafted message may acknowledge
    # it once naturally. See app/rules.py's age handling.
    genuinely_strict_age_requirement: false
    religion_or_confession_required: true
    religious_fraternity_or_membership_required: true
    clear_scam: true
  whole_flat_exception:
    enabled: true
    max_effective_warm_rent_per_person_eur: 600
  warnings:
    no_anmeldung: true
    one_time_fee_review_at_or_above_eur: 500
    deposit_over_cold_rent_multiple: 2
    buergschaft_required: true
    indexmiete: true
    hauptmieter_liability: true

documents:
