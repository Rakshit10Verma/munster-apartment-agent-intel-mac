  formal_words_min: 90
  formal_words_max: 140

sources:
  priority: ["wg_gesucht", "asta_muenster", "na_dann", "kleinanzeigen"]
  low_frequency_interval_seconds: 900

# Near-real-time WG-Gesucht search watcher. Copy exact search-result URLs from your own
# browser after setting your filters/sort; add as many named searches as you like.
# WG_WATCH_MIN_SECONDS / WG_WATCH_MAX_SECONDS in .env override the interval below.
wg_watch:
  min_interval_seconds: 30
  max_interval_seconds: 45
  searches:
    - name: munster_wg
      url: "https://www.wg-gesucht.de/wg-zimmer-in-Muenster.91.0.1.0.html"

contact:
